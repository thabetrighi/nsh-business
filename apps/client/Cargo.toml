[package]
name = "nb-client"
description = "NSH Business app: one NSH client for desktop, mobile and web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
nb-core.workspace = true
nb-i18n.workspace = true
nb-domain.workspace = true
nb-store.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
nsh-core = "=0.4.0"
nsh-base = "=0.4.0"
env_logger = "0.11"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.4.0", default-features = false }

[lints]
workspace = true
