name: web-spike

# M0.1 / M0.4 / M0.5: build the NSH Rust spike for the web target.
# Claude's workspace cannot install the wasm32 target, so the web build runs here.

on:
  push:
    branches: [main]
    paths: ["spikes/**", ".github/workflows/web-spike.yml"]
  workflow_dispatch:

env:
  NSH_VERSION: v0.4.0

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust + wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libgtk-4-dev

      - name: Install NSH CLI
        run: |
          curl -fsSL -o nsh.tar.gz "https://github.com/longbridge/nsh/releases/download/${NSH_VERSION}/nsh-linux-x86_64.tar.gz"
          mkdir -p ~/.nsh && tar -xzf nsh.tar.gz -C ~/.nsh
          echo "$HOME/.nsh/nsh/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/m0-hello

      - name: Install wasm-bindgen-cli matching the lockfile
        working-directory: spikes/m0-hello
        run: |
          cargo generate-lockfile
          V=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/,""); print; exit}' Cargo.lock || true)
          echo "wasm-bindgen in lockfile: ${V:-none}"
          if [ -n "$V" ]; then cargo install wasm-bindgen-cli --version "$V" --locked; fi

      - name: Package for web
        run: nsh --verbose package spikes/m0-hello --target web

      - name: Screenshot in headless Chrome (Arabic / RTL on web)
        run: |
          ls -la .nsh/out/hello
          (cd .nsh/out/hello && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1800,420 --virtual-time-budget=15000 \
            --screenshot=web-rtl.png http://localhost:8000/ || true
          ls -la web-rtl.png

      - name: Upload web build and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: m0-hello-web
          path: |
            .nsh/out/hello/
            web-rtl.png
          if-no-files-found: error

      - name: Publish screenshot to ci/screenshots branch
        run: |
          mkdir -p /tmp/shots && cp web-rtl.png /tmp/shots/m0-5-rtl-web.png
          cd /tmp/shots
          git init -q -b ci/screenshots
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "web screenshot ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci/screenshots
