name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and system libraries
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev clang libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Known vulnerabilities in the dependencies (RustSec; ASVS 15.2): a
  # vulnerable crate fails the build, an unmaintained one is only reported.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
