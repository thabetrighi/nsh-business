name: client-windows

# Builds the NSH Business client for Windows on every push to main that
# touches the app: an installer (NSH-Business-Setup-<version>.exe, per user,
# no administrator rights: Start menu, Installed apps, upgrades in place;
# nsh package writes it with Inno Setup) and a zip (unpack it anywhere and
# run NSH Business.exe). Both are published twice:
# - as the release v0.1.<run>, marked latest, with the update manifest
#   (latest.json): installed copies find it and update themselves
#   (ADR-0011; the version rises with every run);
# - as the "windows-latest" pre-release, the stable download link.
# Also downloadable as the run's artifact.

on:
  push:
    branches: [main]
    paths: ["apps/client/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/client-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-windows
  cancel-in-progress: true

env:
  NSH_VERSION: v0.5.1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal

      - name: Install NSH CLI
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/longbridge/nsh/releases/download/$env:NSH_VERSION/nsh-windows-x86_64.zip" -OutFile nsh.zip
          Expand-Archive nsh.zip -DestinationPath "$HOME\.nsh" -Force
          $exe = Get-ChildItem -Path "$HOME\.nsh" -Recurse -Filter nsh.exe | Select-Object -First 1
          if (-not $exe) { throw "nsh.exe not found in the archive" }
          Write-Host "nsh: $($exe.FullName)"
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # nsh package builds the installer when Inno Setup 6 is there.
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6" -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($iscc) { $iscc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append; Write-Host "ISCC: $($iscc.FullName)" }

      - uses: Swatinem/rust-cache@v2

      # Every build is a newer version, so installed copies take it.
      - name: Version
        id: version
        working-directory: apps/client
        shell: bash
        run: |
          VERSION="0.1.${{ github.run_number }}"
          python -c "import json,sys; p='nsh.json'; d=json.load(open(p,encoding='utf-8')); d['version']=sys.argv[1]; open(p,'w',encoding='utf-8').write(json.dumps(d,indent=2,ensure_ascii=False))" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package for Windows
        id: package
        continue-on-error: true
        working-directory: apps/client
        shell: bash
        run: |
          set -o pipefail
          nsh --verbose package --target windows 2>&1 | tail -80
          ls -la .nsh/out

      # Without NSH's packager, the plain release build still runs on its
      # own: fonts are compiled in and the database lives in %APPDATA%.
      - name: Fallback release build
        if: steps.package.outcome != 'success'
        shell: bash
        run: |
          cargo build --release -p nb-client
          mkdir -p apps/client/.nsh/out/NSH-Business
          cp target/release/nb-client.exe "apps/client/.nsh/out/NSH-Business/NSH Business.exe"

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          $name = "nsh-business-windows-$short.zip"
          $dir = Get-ChildItem -Path apps/client/.nsh/out -Directory | Select-Object -First 1
          Compress-Archive -Path "$($dir.FullName)\*" -DestinationPath $name -Force
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Get-Item $name | Format-List Name, Length

      - name: Installer
        id: setup
        shell: bash
        run: |
          SETUP=$(ls apps/client/.nsh/out/*-setup.exe 2>/dev/null | head -1)
          if [ -n "$SETUP" ]; then
            NAME="NSH-Business-Setup-${{ steps.version.outputs.version }}.exe"
            cp "$SETUP" "$NAME"
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
            ls -la "$NAME"
          else
            echo "no installer was built"; ls -la apps/client/.nsh/out
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nsh-business-windows
          path: |
            ${{ steps.zip.outputs.name }}
            ${{ steps.setup.outputs.name }}
          retention-days: 14

      # The update: the archive nsh package made for the updater, and the
      # manifest that points at it. Only a real package updates (the
      # fallback build has no updater configuration).
      - name: Release with the update manifest
        if: steps.package.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE=$(ls apps/client/.nsh/out/*-"$VERSION"-windows-*.zip | head -1)
          if [ -z "$ARCHIVE" ]; then echo "no updater archive"; ls -la apps/client/.nsh/out; exit 1; fi
          mkdir -p update
          cp "$ARCHIVE" update/
          nsh update-manifest update/*.zip --entry apps/client --notes apps/client/release-notes.md -o update
          cat update/latest.json
          SETUP="${{ steps.setup.outputs.name }}"
          gh release create "v$VERSION" update/* $SETUP --latest --target "$GITHUB_SHA" \
            --title "NSH Business $VERSION" \
            --notes-file apps/client/release-notes.md

      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="${{ steps.zip.outputs.name }}"
          SETUP="${{ steps.setup.outputs.name }}"
          gh release delete windows-latest -y --cleanup-tag 2>/dev/null || true
          gh release create windows-latest "$ZIP" $SETUP --prerelease --target "$GITHUB_SHA" \
            --title "NSH Business — Windows (آخر نسخة)" \
            --notes "نسخة اختبار لويندوز 10/11 من آخر تعديل (${GITHUB_SHA::7}). الأسهل: شغّل NSH-Business-Setup ثم افتح التطبيق من قائمة ابدأ. أو فك ضغط الملف المضغوط في أي مجلد ثم شغّل NSH Business.exe. البيانات تُحفظ في مجلد بيانات المستخدم. غير موقّعة: إن ظهر تحذير SmartScreen اختر «مزيد من المعلومات» ثم «تشغيل على أي حال»."
