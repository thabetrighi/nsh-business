<!doctype html>
<meta charset="utf-8">
<title>M0.4 web storage spike</title>
<pre id="out">running…</pre>
<script type="module">
// Plays the role of the NSH app on the main thread: every DB call is an async message.
const worker = new Worker("./worker.js", { type: "module" });
let next = 0;
const pending = new Map();
worker.onmessage = ({ data }) => {
  const p = pending.get(data.id);
  pending.delete(data.id);
  data.error ? p.reject(new Error(data.error)) : p.resolve(data.value);
};
const call = (fn, ...args) =>
  new Promise((resolve, reject) => {
    const id = next++;
    pending.set(id, { resolve, reject });
    worker.postMessage({ id, fn, args });
  });

const stats = (xs) => {
  const s = [...xs].sort((a, b) => a - b);
  return { median: +s[Math.floor(s.length / 2)].toFixed(2), p95: +s[Math.floor(s.length * 0.95)].toFixed(2) };
};
async function time(n, f) {
  const xs = [];
  for (let i = 0; i < n; i++) {
    const t = performance.now();
    await f(i);
    xs.push(performance.now() - t);
  }
  return stats(xs);
}

const out = document.getElementById("out");
const r = {};
try {
  let t = performance.now();
  r.existing_products_at_open = await call("open");
  r.open_ms = +(performance.now() - t).toFixed(1);
  r.persisted_counts_at_open = JSON.parse(await call("counts"));
  if (r.existing_products_at_open === 0) {
    r.seed_10k_ms = +(await call("seed", 10000)).toFixed(1);
  }
  r.search_arabic_roundtrip_ms = await time(100, () => call("search", "حليب"));
  r.search_prefix_roundtrip_ms = await time(100, () => call("search", "حلي Ifri"));
  const run = Date.now();
  r.complete_sale_roundtrip_ms = await time(100, (i) => call("complete_sale", `op-${run}-${i}`, i));
  r.duplicate_operation_rejected = (await call("complete_sale", `op-${run}-0`, 0)) === false;
  r.counts_after = JSON.parse(await call("counts"));
  r.status = "ok";
} catch (e) {
  r.status = "error";
  r.error = String(e);
}
out.textContent = JSON.stringify(r, null, 2);
out.dataset.done = "1";
</script>
