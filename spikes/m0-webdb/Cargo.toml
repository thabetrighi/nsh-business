[package]
name = "m0-webdb"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# rusqlite >= 0.40 uses sqlite-wasm-rs automatically on wasm32-unknown-unknown.
rusqlite = "0.41"
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = 3
lto = true
