[package]
name = "nb-server"
description = "NSH Business sync server (M11/M1, ADR-0006): one SQLite replica per organization running the same nb-store use cases, devices pushing their operation log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
nb-core.workspace = true
nb-store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.3"
nb-i18n.workspace = true
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
fs4 = "0.13"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusqlite = { workspace = true, features = ["bundled"] }

[lints]
workspace = true
