[package]
name = "nb-server"
description = "NSH Business sync server (M11/M1, ADR-0006): one SQLite replica per organization running the same nb-store use cases, devices pushing their operation log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
nb-core.workspace = true
nb-store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
getrandom = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
