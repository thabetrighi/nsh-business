[package]
name = "nb-store"
description = "Local storage engine of NSH Business: SQLite schema and migrations, unit of work with outbox, idempotency and audit, repositories and use cases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
argon2.workspace = true
nb-core.workspace = true
nb-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Native: SQLite compiled in. Browser: rusqlite uses sqlite-wasm-rs by itself.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite.workspace = true
# The browser's SQLite (as in spike M0.4), with its JavaScript glue.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
